<!doctype html>
<meta charset="utf-8">
<title>End-to-end operation test</title>
<pre id="result">RUNNING</pre>
<iframe id="central-frame" title="Central test"></iframe>
<script>
    (function () {
        var now = Date.now();
        localStorage.clear();
        localStorage.setItem('nexus-ops-auth', JSON.stringify({ id: 'central', name: 'Equipe Central', role: 'admin', roleLabel: 'Administrador', home: 'index.html', createdAt: now, expiresAt: now + 3600000 }));
        localStorage.setItem('central-gelo-state', JSON.stringify({
            schemaVersion: 2,
            revision: 1,
            updatedAt: now,
            resetAt: now,
            production: 500,
            centralStockBags: 100,
            clientStock: 100,
            stockPercent: 3,
            revenueValue: 1000,
            simulationStep: 1,
            nextOrderId: 2001,
            orderNumber: 2001,
            recentOrders: [{ id: 2000, quantity: 50, status: 'route', client: 'Supermercado XYZ', createdAt: now - 10000, statusChangedAt: now - 5000 }]
        }));
        var centralFrame = document.getElementById('central-frame');
        centralFrame.src = 'central-gelo.html?e2e=1';
        window.setTimeout(function () {
            var failures = [];
            function assert(condition, message) { if (!condition) failures.push(message); }
            var state;
            try { state = JSON.parse(localStorage.getItem('central-gelo-state') || '{}'); } catch (error) { state = {}; }
            var delivered = Array.isArray(state.recentOrders) && state.recentOrders.find(function (order) { return order.id === 2000; });
            assert(delivered && delivered.status === 'delivered', 'order #2000 remained stuck in route');
            assert(Number(state.clientStock) === 150, 'client stock was not updated exactly once on delivery');
            assert(Number(state.deliveries) === 0, 'route counter did not close after delivery');
            var clientFrame = document.createElement('iframe');
            clientFrame.id = 'client-frame';
            clientFrame.title = 'Client test';
            clientFrame.onload = function () {
                window.setTimeout(function () {
                    var clientDocument = clientFrame.contentDocument;
                    var stats = clientDocument && clientDocument.querySelectorAll('.stats .stat strong');
                    var visibleText = clientDocument && clientDocument.body ? clientDocument.body.innerText : '';
                    assert(stats && stats[1] && stats[1].textContent.replace(/\D/g, '') === '150', 'client portal did not render the delivered stock');
                    assert(visibleText.indexOf('Pedido #2000') >= 0 && visibleText.indexOf('ENTREGUE') >= 0, 'client portal did not render the delivered order');
                    var notice = clientDocument && clientDocument.querySelector('.delivery-notice');
                    assert(!notice || !(notice.textContent.indexOf('#2000') >= 0 && notice.textContent.indexOf('em rota') >= 0), 'delivered order is still shown as in route');
                    var requestButton = clientDocument && clientDocument.getElementById('new-order');
                    if (requestButton) requestButton.click();
                    else failures.push('client request button was not available');
                    window.setTimeout(function () {
                        var updatedState;
                        try { updatedState = JSON.parse(localStorage.getItem('central-gelo-state') || '{}'); } catch (error) { updatedState = {}; }
                        var requested = Array.isArray(updatedState.recentOrders) && updatedState.recentOrders.find(function (order) { return order.id === 2002; });
                        var centralText = centralFrame.contentDocument && centralFrame.contentDocument.body ? centralFrame.contentDocument.body.innerText : '';
                        assert(requested && requested.status === 'production', 'new client order did not reach the canonical queue');
                        assert(Number(updatedState.clientStock) === 150, 'request incorrectly reduced client stock before delivery');
                        assert(centralText.indexOf('Pedido #2002') >= 0, 'live Central panel did not receive the client order');
                        var resetButton = centralFrame.contentDocument && centralFrame.contentDocument.getElementById('reset-data');
                        if (resetButton) resetButton.click();
                        else failures.push('central reset button was not available');
                        window.setTimeout(function () {
                            var resetState;
                            try { resetState = JSON.parse(localStorage.getItem('central-gelo-state') || '{}'); } catch (error) { resetState = {}; }
                            var resetStats = clientFrame.contentDocument && clientFrame.contentDocument.querySelectorAll('.stats .stat strong');
                            assert(Array.isArray(resetState.recentOrders) && resetState.recentOrders.length === 0, 'reset did not clear the shared queue');
                            assert(Number(resetState.clientStock) === 0, 'reset did not clear the shared client stock');
                            assert(resetStats && resetStats[0] && resetStats[0].textContent === '0', 'client portal did not receive reset in real time');
                            var output = document.getElementById('result');
                            output.dataset.tests = failures.length ? 'failed' : 'passed';
                            output.textContent = failures.length ? failures.join('\n') : 'PASS: Central Gelo ↔ Supermercado XYZ synchronized end to end';
                        }, 800);
                    }, 800);
                }, 800);
            };
            clientFrame.src = 'supermercado-xyz.html?e2e=1';
            document.body.appendChild(clientFrame);
        }, 11200);
    })();
</script>
